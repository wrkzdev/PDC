name: End-to-end

# Real wallet engine -> gateway -> testnet node, deploying and moving an asset on a real chain (utils/docker/e2e).
# Slow (it builds the node and the wallet library), so it runs by hand and weekly, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Run the end-to-end test
        run: bash utils/docker/e2e/run.sh
